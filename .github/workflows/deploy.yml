name: Deploy S3 and CloudFront

on: [push, workflow_dispatch]

jobs:
  deploy-s3-cloudfront:
    runs-on: ubuntu-latest
    env:
      CLOUDFRONT_DISTRIBUTION_ID: E3OJZE4ODVGECC
      S3_BUCKET: cicd-practice-s3-diego
    environment:
      name: aws-s3-cloudfront
      url: d3lvso412a5i8x.cloudfront.net

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Stamp deployment target
        run: sed -i 's/unknown/AWS S3 + CloudFront/' index.html

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
          mask-aws-account-id: true

      - name: Sync site to S3
        run: aws s3 sync . "s3://${S3_BUCKET}" --exclude ".git/*" --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"